<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Objeto — ATL Library</title>
    <meta name="description" content="Objeto GDL para ArchiCAD de ATL Library.">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="shortcut icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;600&family=Barlow+Condensed:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/library-bar.css?v=3">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:         #080808;
            --white:      #ffffff;
            --lilac:      #c4b5d4;
            --amber:      #d4845a;
            --gray:       #666666;
            --font-title: 'Barlow Condensed', sans-serif;
            --font-body:  'Inter', sans-serif;
        }

        html, body { width: 100%; overflow-x: clip; }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        /* ── NAV (idéntico al index) ── */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.5s ease, backdrop-filter 0.5s ease, padding 0.4s ease, border-color 0.5s ease;
            border-bottom: 1px solid transparent;
        }
        nav.scrolled {
            background: rgba(8,8,8,0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 1.2rem 3rem;
        }
        .nav-logo {
            font-family: var(--font-title);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--white);
            text-decoration: none;
            display: inline-flex;
            align-items: baseline;
        }
        .nav-logo span {
            font-weight: 200;
            opacity: 0.75;
            margin-left: 5px;
            letter-spacing: 0.1em;
            text-transform: none;
        }
        .nav-sep {
            width: 1px; height: 1rem;
            background: rgba(255,255,255,0.15);
            margin: 0 1.2rem;
        }
        .nav-product {
            font-family: var(--font-title);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--lilac);
            opacity: 0.9;
        }
        .nav-badge {
            margin-left: 0.8rem;
            font-size: 0.45rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--lilac);
            border: 1px solid rgba(196,181,212,0.35);
            padding: 0.2rem 0.55rem;
            opacity: 0.8;
        }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a {
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.65);
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--white); }

        /* ── NAV TOGGLE (hamburguesa, solo móvil/tablet) ── */
        .nav-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 32px;
            height: 32px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1100;
        }
        .nav-toggle span {
            display: block;
            width: 100%;
            height: 1px;
            background: var(--white);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .nav-toggle.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
        .nav-toggle.open span:nth-child(2) { opacity: 0; }
        .nav-toggle.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

        .mobile-menu {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(8, 8, 8, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-12px);
            transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s;
        }
        .mobile-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .mobile-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
        }
        .mobile-menu a {
            font-family: var(--font-title);
            font-size: 1.4rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--white);
            text-decoration: none;
        }

        /* El nav (logo + producto + links) necesita más de 640px reales para no
           encimarse; se rompe a hamburguesa antes de ese punto de quiebre. */
        @media (max-width: 1100px) {
            nav { padding: 1.5rem 2rem; }
            .nav-links { display: none; }
            .nav-toggle { display: flex; }
        }
        /* El bloque logo + "Library" no cabe junto al botón hamburguesa
           en celulares angostos; se reduce para dejarle espacio. */
        @media (max-width: 480px) {
            .nav-logo { font-size: 0.95rem; }
            .nav-sep { margin: 0 0.6rem; }
            .nav-product { font-size: 0.8rem; }
            .nav-badge { margin-left: 0.4rem; padding: 0.15rem 0.4rem; }
        }

        /* ── HERO ── */
        #hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10rem 2rem 6rem;
            position: relative;
            overflow: hidden;
            background: rgba(8, 8, 8, 0.78);
        }
        .hero-glow {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 50% 35%, rgba(196,181,212,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 35% 25% at 15% 85%, rgba(196,181,212,0.03) 0%, transparent 60%);
            pointer-events: none;
        }
        .hero-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
        }
        .hero-content { position: relative; z-index: 1; }

        .hero-label {
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--lilac);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
        .hero-label::before, .hero-label::after {
            content: '';
            display: block;
            width: 2rem;
            height: 1px;
            background: rgba(196,181,212,0.4);
        }

        .hero-title {
            font-family: var(--font-title);
            font-size: clamp(4.5rem, 12vw, 11rem);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 0.3em;
        }
        .hero-title-sub {
            font-family: var(--font-title);
            font-size: clamp(1.5rem, 4vw, 3.5rem);
            font-weight: 200;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--lilac);
            margin-bottom: 2.5rem;
        }

        .hero-desc {
            font-size: clamp(0.75rem, 1.5vw, 0.9rem);
            font-weight: 300;
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.5);
            max-width: 480px;
            margin: 0 auto 3rem;
            line-height: 1.8;
        }

        .hero-platforms {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 3rem;
        }
        .platform-tag {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
        }
        .platform-tag svg { opacity: 0.5; }
        .platform-status {
            font-size: 0.45rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.15rem 0.5rem;
            border: 1px solid rgba(196,181,212,0.3);
            color: var(--lilac);
        }

        .hero-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 2.5rem;
            background: var(--white);
            color: var(--bg);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover { background: var(--lilac); }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 2.5rem;
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--white);
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover { border-color: var(--white); background: rgba(255,255,255,0.05); }
        .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }

        .hero-counter {
            margin-top: 2.5rem;
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
        }
        .hero-counter strong {
            color: var(--lilac);
            font-weight: 400;
        }

        /* ── MOCKUP ── */
        .mockup-wrap {
            padding: 0 3rem 8rem;
            display: flex;
            justify-content: center;
        }
        .mockup-window {
            max-width: 960px;
            width: 100%;
            background: #0e0e0e;
            border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 50px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
        }
        .mockup-bar {
            background: #111;
            padding: 0.9rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .mockup-dot { width: 12px; height: 12px; border-radius: 50%; }
        .mockup-dot:nth-child(1) { background: #ff5f57; }
        .mockup-dot:nth-child(2) { background: #febc2e; }
        .mockup-dot:nth-child(3) { background: #28c840; }
        .mockup-name {
            margin: 0 auto;
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
        }
        .mockup-body {
            display: grid;
            grid-template-columns: 190px 1fr 170px;
            min-height: 440px;
        }
        .mockup-sidebar {
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 1.2rem 0;
            background: rgba(0,0,0,0.25);
        }
        .m-label {
            padding: 1rem 1.2rem 0.4rem;
            font-size: 0.45rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.18);
        }
        .m-item {
            padding: 0.55rem 1.2rem;
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.35);
            border-left: 2px solid transparent;
            cursor: default;
        }
        .m-item.active {
            color: var(--lilac);
            border-left-color: var(--lilac);
            background: rgba(196,181,212,0.06);
        }
        .mockup-main {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .mockup-canvas {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            position: relative;
        }
        .mockup-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }
        .m-metric {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 0.8rem;
        }
        .m-metric-label {
            font-size: 0.45rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            margin-bottom: 0.3rem;
        }
        .m-metric-value {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: var(--lilac);
        }
        .mockup-panel {
            border-left: 1px solid rgba(255,255,255,0.06);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .m-panel-title {
            font-size: 0.45rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .m-field { display: flex; flex-direction: column; gap: 0.25rem; }
        .m-field-label {
            font-size: 0.45rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
        }
        .m-field-val {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 0.35rem 0.6rem;
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.7);
        }
        .m-run-btn {
            margin-top: auto;
            background: var(--lilac);
            color: var(--bg);
            border: none;
            padding: 0.6rem;
            font-size: 0.55rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: default;
            text-align: center;
        }

        /* ── SECCIÓN GENÉRICA ── */
        .section {
            padding: 8rem 3rem;
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(8, 8, 8, 0.78);
        }
        #threejs-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
            display: block;
        }
        .section-label {
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--lilac);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .section-label::before {
            content: '';
            display: block;
            width: 1.5rem;
            height: 1px;
            background: rgba(196,181,212,0.4);
        }
        .section-title {
            font-family: var(--font-title);
            font-size: clamp(2.2rem, 5vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 1.5rem;
        }
        .section-desc {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.04em;
            color: rgba(255,255,255,0.45);
            max-width: 500px;
            line-height: 1.8;
            margin-bottom: 5rem;
        }

        /* ── FEATURES ── */
        #features { border-top: 1px solid rgba(255,255,255,0.05); }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .feature {
            padding: 3rem 2.5rem;
            border-right: 1px solid rgba(255,255,255,0.05);
            transition: background 0.3s;
        }
        .feature:last-child { border-right: none; }
        .feature:hover { background: rgba(255,255,255,0.015); }
        .feature-num {
            font-family: var(--font-title);
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: 0.05em;
            color: rgba(196,181,212,0.15);
            line-height: 1;
            margin-bottom: 2rem;
        }
        .feature-icon {
            color: rgba(196,181,212,0.5);
            margin-bottom: 1.5rem;
        }
        .feature-name {
            font-family: var(--font-title);
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }
        .feature-desc {
            font-size: 0.78rem;
            font-weight: 300;
            letter-spacing: 0.03em;
            color: rgba(255,255,255,0.4);
            line-height: 1.75;
        }
        .feature-tag {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.45rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(196,181,212,0.5);
            border: 1px solid rgba(196,181,212,0.2);
            padding: 0.2rem 0.7rem;
        }

        /* ── COMPATIBILIDAD ── */
        #compat { border-top: 1px solid rgba(255,255,255,0.05); }
        .compat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        .compat-card {
            border: 1px solid rgba(255,255,255,0.05);
            padding: 3rem;
            display: flex;
            gap: 2rem;
            align-items: flex-start;
            transition: border-color 0.3s;
        }
        .compat-card:hover { border-color: rgba(196,181,212,0.2); }
        .compat-icon { color: rgba(196,181,212,0.5); flex-shrink: 0; margin-top: 0.2rem; }
        .compat-name {
            font-family: var(--font-title);
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .compat-req {
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.3);
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        .compat-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .compat-status.ready { color: #3ecf8e; }
        .compat-status.soon  { color: rgba(255,255,255,0.35); }
        .status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

        /* ── PRECIOS ── */
        #pricing { border-top: 1px solid rgba(255,255,255,0.05); }
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            max-width: 820px;
        }
        .pricing-card {
            border: 1px solid rgba(255,255,255,0.05);
            padding: 3rem;
            position: relative;
        }
        .pricing-card.featured { border-color: rgba(196,181,212,0.25); }
        .pricing-plan {
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 1.5rem;
        }
        .pricing-price {
            font-family: var(--font-title);
            font-size: 3.5rem;
            font-weight: 200;
            letter-spacing: 0.02em;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .pricing-note {
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.3);
            margin-bottom: 2.5rem;
        }
        .pricing-divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 2rem;
        }
        .pricing-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 2.5rem;
        }
        .pricing-list li {
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: rgba(255,255,255,0.45);
            display: flex;
            gap: 0.8rem;
        }
        .pricing-list li::before {
            content: '—';
            color: var(--lilac);
            opacity: 0.5;
            flex-shrink: 0;
        }
        .pricing-badge {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            font-size: 0.45rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--lilac);
            border: 1px solid rgba(196,181,212,0.3);
            padding: 0.2rem 0.6rem;
        }

        /* ── DESCARGA ── */
        #waitlist {
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .download-box {
            border: 1px solid rgba(255,255,255,0.05);
            padding: 4rem;
            max-width: 680px;
            margin: 0 auto;
            background: rgba(8, 8, 8, 0.85);
        }
